<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search - Trustpilot Help Center</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Trustpilot Sans", Arial, sans-serif;
    color: #2D2F29;
    background: #ffffff;
  }
  a { color: inherit; text-decoration: none; }

  header {
    border-bottom: 1px solid #E5E5E5;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }
  .logo svg { width: 22px; height: 22px; }
  nav { display: flex; align-items: center; gap: 28px; font-size: 14px; }
  nav a { cursor: pointer; }
  nav a:hover { text-decoration: underline; }

  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 40px 80px;
  }
  .breadcrumb {
    font-size: 14px;
    color: #605E56;
    margin-bottom: 20px;
  }
  .breadcrumb a { color: #04A672; }
  .breadcrumb a:hover { text-decoration: underline; }

  .search-bar-row {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
  }
  .search-bar-row .search-input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid #DCD6D1;
    border-radius: 8px;
    padding: 0 16px;
  }
  .search-bar-row input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    padding: 14px 0;
    font-family: inherit;
  }
  .search-bar-row button {
    background: #04DA8D;
    color: #022A1C;
    border: none;
    border-radius: 8px;
    padding: 0 28px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .search-bar-row button:hover { background: #03c37f; }

  .layout {
    display: flex;
    gap: 40px;
  }

  .filters {
    width: 230px;
    flex-shrink: 0;
  }
  .filters h3 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #605E56;
    margin: 24px 0 10px;
  }
  .filters h3:first-child { margin-top: 0; }
  .filter-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    padding: 5px 0;
    cursor: pointer;
  }
  .filter-option input { cursor: pointer; accent-color: #04DA8D; width: 15px; height: 15px; }
  .filter-count { color: #605E56; font-size: 12px; margin-left: auto; }
  .topic-filters { max-height: 320px; overflow-y: auto; padding-right: 4px; }

  .results {
    flex: 1;
    min-width: 0;
  }
  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .results-count { font-size: 15px; }
  .results-count strong { font-weight: 700; }
  .sort-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }
  .sort-row select {
    border: 1px solid #DCD6D1;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 14px;
    font-family: inherit;
    background: #ffffff;
  }

  .result-card {
    border: 1px solid #E5E5E5;
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .result-card h4 {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .result-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
    color: #605E56;
  }
  .tag-pill {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .empty-state {
    padding: 48px 0;
    text-align: center;
    color: #605E56;
    font-size: 15px;
  }
</style>
</head>

    <div class="search-bar-row">
      <div class="search-input-wrap">
        <span>&#128269;</span>
        <input id="search-input" type="search" placeholder="Search Trustpilot Help...">
      </div>
      <button id="search-btn">Search</button>
    </div>

    <div class="layout">
      <aside class="filters">
        <h3>Audience</h3>
        <label class="filter-option"><input type="checkbox" id="audience-all" checked> All</label>
        <label class="filter-option"><input type="checkbox" id="audience-reviewer"> Reviewers</label>
        <label class="filter-option"><input type="checkbox" id="audience-business"> Businesses</label>

        <h3>Content Type</h3>
        <label class="filter-option"><input type="checkbox" class="type-checkbox" value="article"> Articles</label>
        <label class="filter-option"><input type="checkbox" class="type-checkbox" value="guide"> Guides</label>

        <h3>Topic</h3>
        <div class="topic-filters" id="topic-filters"></div>
      </aside>

      <main class="results">
        <div class="results-header">
          <div class="results-count" id="results-count"></div>
          <div class="sort-row">
            Sort
            <select id="sort-select">
              <option value="relevant">Most relevant</option>
              <option value="recent">Most recent</option>
            </select>
          </div>
        </div>
        <div id="results-list"></div>
      </main>
    </div>

  <script src="data.js"></script>
  <script>
  (function () {
    var TAG_COLORS = {
      REVIEWER: { bg: '#FFC2A6', color: '#5A1B0C' },
      BUSINESS: { bg: '#BFB9F1', color: '#33236A' }
    };

    var params = new URLSearchParams(location.search);
    var initialQuery = params.get('q') || '';
    var initialAudience = params.get('audience'); // 'reviewer' | 'business' | null

    var searchInput = document.getElementById('search-input');
    var searchBtn = document.getElementById('search-btn');
    var audienceAll = document.getElementById('audience-all');
    var audienceReviewer = document.getElementById('audience-reviewer');
    var audienceBusiness = document.getElementById('audience-business');
    var topicFiltersEl = document.getElementById('topic-filters');
    var resultsListEl = document.getElementById('results-list');
    var resultsCountEl = document.getElementById('results-count');
    var breadcrumbQueryEl = document.getElementById('breadcrumb-query');
    var sortSelect = document.getElementById('sort-select');

    searchInput.value = initialQuery;
    if (initialAudience === 'reviewer') {
      audienceAll.checked = false;
      audienceReviewer.checked = true;
    } else if (initialAudience === 'business') {
      audienceAll.checked = false;
      audienceBusiness.checked = true;
    }

    // Audience checkboxes behave like a single-select group.
    function setAudience(which) {
      audienceAll.checked = which === 'all';
      audienceReviewer.checked = which === 'reviewer';
      audienceBusiness.checked = which === 'business';
      render();
    }
    audienceAll.addEventListener('change', function () { setAudience('all'); });
    audienceReviewer.addEventListener('change', function () { setAudience(audienceReviewer.checked ? 'reviewer' : 'all'); });
    audienceBusiness.addEventListener('change', function () { setAudience(audienceBusiness.checked ? 'business' : 'all'); });

    // Build the Topic checkbox list from the real data, alphabetically, deduped.
    var allTopics = Array.from(new Set(HELP_CENTER_ARTICLES.map(function (a) { return a.topic; }))).sort();
    allTopics.forEach(function (topic) {
      var label = document.createElement('label');
      label.className = 'filter-option';
      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'topic-checkbox';
      checkbox.value = topic;
      checkbox.addEventListener('change', render);
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(topic));
      topicFiltersEl.appendChild(label);
    });

    document.querySelectorAll('.type-checkbox').forEach(function (cb) {
      cb.addEventListener('change', render);
    });
    sortSelect.addEventListener('change', render);

    function matchArticle(article, q) {
      if (!q) return true;
      if (article.label.toLowerCase().indexOf(q) !== -1) return true;
      if (article.topic && article.topic.toLowerCase().indexOf(q) !== -1) return true;
      if (article.subtopic && article.subtopic.toLowerCase().indexOf(q) !== -1) return true;
      for (var i = 0; i < article.keywords.length; i++) {
        if (article.keywords[i].toLowerCase().indexOf(q) !== -1) return true;
      }
      return false;
    }

    function relevanceScore(article, q) {
      if (!q) return 0;
      var label = article.label.toLowerCase();
      if (label.indexOf(q) === 0) return 3;
      if (label.indexOf(q) !== -1) return 2;
      return 1;
    }

    function currentAudienceFilter() {
      if (audienceReviewer.checked) return 'reviewer';
      if (audienceBusiness.checked) return 'business';
      return null;
    }

    function currentTypeFilters() {
      return Array.from(document.querySelectorAll('.type-checkbox:checked')).map(function (cb) { return cb.value; });
    }

    function currentTopicFilters() {
      return Array.from(document.querySelectorAll('.topic-checkbox:checked')).map(function (cb) { return cb.value; });
    }

    function render() {
      var q = searchInput.value.trim().toLowerCase();
      breadcrumbQueryEl.textContent = q ? 'Search: "' + searchInput.value.trim() + '"' : 'All articles';

      var audienceFilter = currentAudienceFilter();
      var typeFilters = currentTypeFilters();
      var topicFilters = currentTopicFilters();

      var results = HELP_CENTER_ARTICLES.filter(function (a) {
        if (audienceFilter && a.audience !== audienceFilter) return false;
        if (typeFilters.length > 0 && typeFilters.indexOf(a.type) === -1) return false;
        if (topicFilters.length > 0 && topicFilters.indexOf(a.topic) === -1) return false;
        return matchArticle(a, q);
      });

      if (sortSelect.value === 'recent') {
        results = results.slice().reverse();
      } else {
        results = results.slice().sort(function (a, b) { return relevanceScore(b, q) - relevanceScore(a, q); });
      }

      resultsCountEl.innerHTML = '<strong>' + results.length + '</strong> results' + (q ? ' for "' + searchInput.value.trim() + '"' : '');

      resultsListEl.innerHTML = '';
      if (results.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No articles match your search and filters.';
        resultsListEl.appendChild(empty);
        return;
      }

      results.forEach(function (a) {
        var tagStyle = TAG_COLORS[a.tag] || { bg: '#EEEEEE', color: '#333333' };
        var card = document.createElement('div');
        card.className = 'result-card';
        card.style.cursor = 'pointer';
        card.innerHTML =
          '<h4>' + a.label + '</h4>' +
          '<div class="result-meta">' +
            '<span class="tag-pill" style="background:' + tagStyle.bg + ';color:' + tagStyle.color + ';">' + a.tag + '</span>' +
            '<span>' + a.topic + (a.subtopic ? ' &rsaquo; ' + a.subtopic : '') + '</span>' +
            '<span>&#9634; ' + (a.type === 'guide' ? 'Guide' : 'Article') + '</span>' +
          '</div>';
        card.addEventListener('click', function () { window.location.href = a.pageUrl; });
        resultsListEl.appendChild(card);
      });
    }

    function submitSearch() {
      render();
    }
    searchBtn.addEventListener('click', submitSearch);
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') submitSearch();
    });

    document.getElementById('logo-home').addEventListener('click', function () {
      window.location.href = 'index.html';
    });

    render();
  })();
  </script>
  <div id="site-footer"></div>
  <script src="footer.js"></script>
</body>
</html>
